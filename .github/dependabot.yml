version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # eslint and @eslint/js must move together (peer dependency), separate
      # major PRs each fail on their own.
      eslint:
        patterns: [eslint, '@eslint/*']
        update-types: [major]
    ignore:
      # otplib 13 dropped the authenticator.checkDelta() API that TOTP replay
      # protection relies on (twofa.service.js) - see CLAUDE.md. Upgrade by hand.
      - dependency-name: otplib
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      eslint:
        patterns: [eslint, '@eslint/*']
        update-types: [major]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
