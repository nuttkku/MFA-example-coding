name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      # Report every workspace's audit result instead of cancelling the rest
      # as soon as one fails.
      fail-fast: false
      matrix:
        workspace: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.workspace }}
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.workspace }}

  security-scan:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan \
              --config p/security-audit --config p/secrets --config p/javascript --config p/nodejsscan \
              --exclude node_modules --exclude "*.md" \
              --error \
              /src

  quality:
    name: Lint, format check and unit tests (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.workspace }}
      - run: npm run lint
        working-directory: ${{ matrix.workspace }}
      - name: Prettier (JS files only - see .prettierignore)
        run: npx --yes prettier@3.9.10 --check .
      - name: Unit tests (no database needed)
        if: matrix.workspace == 'backend'
        run: npm test
        working-directory: backend

  osv-scan:
    name: OSV-Scanner (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan lockfiles against the OSV database
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" ghcr.io/google/osv-scanner:latest             scan source -r /src

  secret-scan:
    name: Gitleaks (secrets in git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest             detect --source /repo --no-banner --redact

  skills-sync:
    name: skills/ and .claude/skills/ are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # skills/ is the human-facing copy, .claude/skills/ is what Claude Code
      # loads automatically after a clone - they must never drift apart.
      - run: diff -r -x README.md skills .claude/skills

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build

  image-scan:
    name: Trivy image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        include:
          # npm ships its own bundled dependency tree (tar/glob/minimatch/...)
          # under the npm CLI's own node_modules, used only for package
          # management operations (install/extract) - never invoked by this
          # app's runtime code, so it's excluded rather than chased CVE by CVE.
          - service: backend
            skip_dirs: /usr/local/lib/node_modules/npm
          - service: frontend
            skip_dirs: /usr/local/lib/node_modules/npm
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t mfa-example-${{ matrix.service }}:scan ./${{ matrix.service }}

      # Scans the built image itself (OS packages + language deps baked into
      # the final layers) - complements the `audit`/`security-scan` jobs above,
      # which only look at source and package.json, not what actually ends up
      # in the image (base image OS packages, transitive deps resolved at
      # build time, etc).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mfa-example-${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: ${{ matrix.skip_dirs }}

  smoke-test:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Generate throwaway secrets for this run
        run: bash scripts/generate-secrets.sh

      - name: Start stack
        run: docker compose up -d --build

      # Wait through the Vite proxy, not the backend port: smoke-test.sh talks
      # to :5173, and the dev server can come up after the backend does.
      - name: Wait for frontend proxy and backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/api/health > /dev/null; then
              echo "stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time" >&2
          exit 1

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  ui-test:
    name: Browser UI test (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Generate throwaway secrets for this run
        run: bash scripts/generate-secrets.sh

      - name: Start stack
        run: docker compose up -d --build

      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for frontend proxy and backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/api/health > /dev/null; then
              echo "stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become healthy in time" >&2
          exit 1

      - name: Run UI tests
        working-directory: e2e
        run: node ui-test.mjs

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  keycloak-test:
    name: SSO browser test with Keycloak (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.keycloak.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Generate throwaway secrets for this run
        run: bash scripts/generate-secrets.sh

      - name: Start stack with the Keycloak addon
        run: docker compose $COMPOSE_FILES up -d --build

      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Keycloak needs longer than the app to import its realm and turn healthy;
      # the backend only starts once it is (depends_on: service_healthy).
      - name: Wait for backend health and the Keycloak provider
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:5173/api/auth/sso/providers | grep -q keycloak; then
              echo "stack is up with Keycloak enabled"
              exit 0
            fi
            sleep 3
          done
          echo "stack did not become healthy in time" >&2
          exit 1

      - name: Run Keycloak SSO tests
        working-directory: e2e
        run: node keycloak-test.mjs

      - name: Dump service logs on failure
        if: failure()
        run: docker compose $COMPOSE_FILES logs

      - name: Tear down
        if: always()
        run: docker compose $COMPOSE_FILES down -v
